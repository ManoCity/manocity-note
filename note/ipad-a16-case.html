<h1>iPad（A16）ケースの選び方 — 動画と漫画がメインなら</h1>
<p>用途が動画と漫画なら、耐衝撃よりも「軽さ」と「立てたときの安定」が大事です。</p>
<h2>見るべきポイント</h2>
<ul>
<li>重さ：本体約477g。ケースで200gを超えると、寝転んで読むときに腕が疲れます</li>
<li>スタンド角度：動画用（60度前後）と読書用（30度前後）の2段階があると便利です</li>
<li>ペン収納：ペンを使わないなら、収納なしのほうが薄くて軽いです</li>
</ul>
